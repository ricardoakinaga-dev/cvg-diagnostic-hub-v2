# Secrets as files (PROD-302, D-051): every secret of docker-compose.prod.yml comes from a file in SECRETS_DIR, mounted
# read-only into the services that need it (/run/secrets/<name>), never from the env file, the Compose interpolation
# or the build host. The env file keeps only non-secret settings; the NAME variables stay EMPTY there (a NAME set
# together with a NAME_FILE is refused by the processes).
#
#   bash scripts/secrets-init.sh /etc/cvg-hub/prod/secrets        # once per environment: random files, mode 600
#   docker compose -p cvg-prod -f docker-compose.prod.yml -f docker-compose.onprem.yml -f docker-compose.secrets.yml \
#     --env-file /etc/cvg-hub/prod.env up -d
#
# Rotation (docs/operations/DEPLOYMENT.md section 13): change the file, recreate the services that read it (`up -d`
# recreates what changed; the migrate service re-applies database passwords from the files on every run).
x-session-secret-file: &session-secret-file /run/secrets/session_secret
x-trust-proxy-file: &trust-proxy-file /run/secrets/trust_proxy_shared_secret
x-runtime-password-file: &runtime-password-file /run/secrets/postgres_runtime_password

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: ["postgres_password"]

  migrate:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_migration_password
      POSTGRES_RUNTIME_PASSWORD_FILE: *runtime-password-file
      POSTGRES_BACKUP_PASSWORD_FILE: /run/secrets/postgres_backup_password
      SESSION_SECRET_FILE: *session-secret-file
      TRUST_PROXY_SHARED_SECRET_FILE: *trust-proxy-file
    secrets: ["postgres_password", "postgres_migration_password", "postgres_runtime_password", "postgres_backup_password", "session_secret", "trust_proxy_shared_secret"]

  app:
    environment:
      POSTGRES_RUNTIME_PASSWORD_FILE: *runtime-password-file
      SESSION_SECRET_FILE: *session-secret-file
      TRUST_PROXY_SHARED_SECRET_FILE: *trust-proxy-file
      METRICS_SCRAPE_TOKEN_FILE: /run/secrets/metrics_scrape_token
    secrets: ["postgres_runtime_password", "session_secret", "trust_proxy_shared_secret", "metrics_scrape_token"]

  worker:
    environment:
      POSTGRES_RUNTIME_PASSWORD_FILE: *runtime-password-file
      SESSION_SECRET_FILE: *session-secret-file
      TRUST_PROXY_SHARED_SECRET_FILE: *trust-proxy-file
    secrets: ["postgres_runtime_password", "session_secret", "trust_proxy_shared_secret"]

  bootstrap:
    environment:
      POSTGRES_RUNTIME_PASSWORD_FILE: *runtime-password-file
      SESSION_SECRET_FILE: *session-secret-file
      TRUST_PROXY_SHARED_SECRET_FILE: *trust-proxy-file
    secrets: ["postgres_runtime_password", "session_secret", "trust_proxy_shared_secret"]

  backup:
    environment:
      PGPASSWORD_FILE: *runtime-password-file
      PGBACKUP_PASSWORD_FILE: /run/secrets/postgres_backup_password
    secrets: ["postgres_runtime_password", "postgres_backup_password"]

  proxy:
    environment:
      TRUST_PROXY_SHARED_SECRET_FILE: *trust-proxy-file
    secrets: ["trust_proxy_shared_secret"]

  offsite:
    environment:
      OFFSITE_CRYPT_PASSWORD_FILE: /run/secrets/offsite_crypt_password
      OFFSITE_CRYPT_SALT_FILE: /run/secrets/offsite_crypt_salt
    secrets: ["offsite_crypt_password", "offsite_crypt_salt"]

secrets:
  postgres_password:
    file: ${SECRETS_DIR:?SECRETS_DIR must point to the directory of secret files}/postgres_password
  postgres_migration_password:
    file: ${SECRETS_DIR:?}/postgres_migration_password
  postgres_runtime_password:
    file: ${SECRETS_DIR:?}/postgres_runtime_password
  # May be an empty file: no base backups and no PITR (BACKUP_RESTORE.md).
  postgres_backup_password:
    file: ${SECRETS_DIR:?}/postgres_backup_password
  session_secret:
    file: ${SECRETS_DIR:?}/session_secret
  trust_proxy_shared_secret:
    file: ${SECRETS_DIR:?}/trust_proxy_shared_secret
  # May be an empty file: metrics only for an ADMIN session.
  metrics_scrape_token:
    file: ${SECRETS_DIR:?}/metrics_scrape_token
  offsite_crypt_password:
    file: ${SECRETS_DIR:?}/offsite_crypt_password
  offsite_crypt_salt:
    file: ${SECRETS_DIR:?}/offsite_crypt_salt
