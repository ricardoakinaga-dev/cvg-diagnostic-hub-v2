# On-prem overlay (D11, PROD-307/PROD-308/PROD-514): object storage (MinIO) and the antivirus (ClamAV + the HTTPS
# scanner adapter) run on the hospital server, next to the production stack, instead of being managed services.
# Nothing here publishes a port: the app and the worker reach storage and scanner on the Compose network only.
#
#   bash scripts/onprem-init.sh .data/onprem          # once: internal CA, scanner certificate, MinIO KMS key (outside git)
#   docker compose -f docker-compose.prod.yml -f docker-compose.onprem.yml --env-file .env.production up -d --build
#
# .env.production for this overlay (values the base file requires):
#   STORAGE_ENDPOINT=http://storage:9000  STORAGE_FORCE_PATH_STYLE=true  STORAGE_BUCKET=cvg-attachments
#   MALWARE_SCANNER_ENDPOINT=https://scanner:9443/scan  MALWARE_SCANNER_ALLOWED_HOSTS=scanner
# Everything else (bucket hardening, encryption key, quarantine owner, bucket copy and restore) is in
# docs/operations/DEPLOYMENT.md section 11 and docs/operations/BACKUP_RESTORE.md.

x-onprem-storage-environment: &onprem-storage-environment
  STORAGE_MODE: s3
  STORAGE_ENDPOINT: http://storage:9000
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET must be set}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set}
  STORAGE_FORCE_PATH_STYLE: "true"
  STORAGE_SCAN_MODE: external
  MALWARE_SCANNER_ENDPOINT: https://scanner:9443/scan
  MALWARE_SCANNER_ALLOWED_HOSTS: scanner
  # The scanner certificate is signed by the internal CA generated by scripts/onprem-init.sh.
  NODE_EXTRA_CA_CERTS: /certs/ca.crt

x-onprem-ca-volume: &onprem-ca-volume ${ONPREM_DIR:-./.data/onprem}/certs/ca.crt:/certs/ca.crt:ro

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

services:
  # MinIO built from the pinned upstream source (deploy/minio/Dockerfile). Encryption at rest: every object is
  # encrypted with the key in the Docker secret (MINIO_KMS_SECRET_KEY_FILE, generated outside git by onprem-init.sh);
  # losing that file makes every attachment unreadable, so it belongs in the secret store with the database passwords.
  # No console, no published port. Versioning, default SSE, private policy and the lifecycle are applied and verified
  # by storage-init (scripts/init-storage.ts, STORAGE_HARDEN=true).
  storage:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-cvg-hub}-minio:${MINIO_IMAGE_TAG:-7aac2a2}
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    command: ["server", "/data"]
    restart: unless-stopped
    mem_limit: ${STORAGE_MEM_LIMIT:-1g}
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?}
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio-kms-key
      MINIO_KMS_AUTO_ENCRYPTION: "on"
      MINIO_BROWSER: "off"
    secrets: ["minio-kms-key"]
    volumes:
      - cvg-storage:/data
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot on every `up`: creates the bucket when missing and applies + verifies the hardening (PROD-307, D-050).
  # Fails (and keeps app and worker down) when the bucket deviates: no versioning, no encryption, anonymous read
  # allowed, or a lifecycle that expires current objects.
  storage-init:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-cvg-hub}-ops:${IMAGE_TAG:-latest}
    command: ["node_modules/.bin/tsx", "scripts/init-storage.ts"]
    environment:
      <<: *onprem-storage-environment
      STORAGE_HARDEN: "true"
      STORAGE_NONCURRENT_VERSION_DAYS: ${STORAGE_NONCURRENT_VERSION_DAYS:-30}
    volumes:
      - *onprem-ca-volume
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"
    mem_limit: 512m

  # Real antivirus (PROD-308). The image ships the signature database and refreshes it with freshclam; the daemon
  # listens on 3310 for the scanner adapter only. Signature updates need egress to database.clamav.net (DEPLOYMENT section 11).
  clamav:
    logging: *default-logging
    image: clamav/clamav@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEM_LIMIT:-2g}
    volumes:
      - cvg-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

  # HTTPS adapter between the app's scan contract and clamd (deploy/local/scanner.mjs, shared with the local
  # installation). The app only accepts it over HTTPS with host `scanner` on the allowlist.
  scanner:
    logging: *default-logging
    image: node:22-bookworm-slim
    user: node
    command: ["node", "/service/scanner.mjs"]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      MALWARE_SCANNER_API_KEY: ${MALWARE_SCANNER_API_KEY:?MALWARE_SCANNER_API_KEY must be set}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    volumes:
      - ./deploy/local/scanner.mjs:/service/scanner.mjs:ro
      - ${ONPREM_DIR:-./.data/onprem}/certs/scanner.crt:/certs/scanner.crt:ro
      - ${ONPREM_DIR:-./.data/onprem}/certs/scanner.key:/certs/scanner.key:ro
      - *onprem-ca-volume
    depends_on:
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:9443/health', {ca:require('fs').readFileSync('/certs/ca.crt')}, r => {r.resume(); if(r.statusCode!==200) process.exit(1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    environment: *onprem-storage-environment
    volumes:
      - *onprem-ca-volume
    depends_on:
      storage-init: { condition: service_completed_successfully }
      scanner: { condition: service_healthy }

  # The worker removes attachment objects in the clinical purge (PROD-501) and validates the scanner configuration at boot.
  worker:
    environment: *onprem-storage-environment
    volumes:
      - *onprem-ca-volume
    depends_on:
      storage-init: { condition: service_completed_successfully }

  migrate:
    environment: *onprem-storage-environment
    volumes:
      - *onprem-ca-volume

  bootstrap:
    environment: *onprem-storage-environment
    volumes:
      - *onprem-ca-volume

  # The off-site copy also ships the bucket (PROD-514): the `minio` rclone remote is defined from the environment
  # (no edit to rclone.conf) and the objects go to <OFFSITE_RCLONE_REMOTE>/objects with `copy --ignore-existing`.
  offsite:
    environment:
      OFFSITE_BUCKET_SOURCE: minio:${STORAGE_BUCKET:?}
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://storage:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?}
      RCLONE_CONFIG_MINIO_REGION: ${STORAGE_REGION:-us-east-1}
    depends_on:
      storage: { condition: service_healthy }

secrets:
  # "<key name>:<base64 of 32 random bytes>", written by scripts/onprem-init.sh with mode 600. Never in git.
  minio-kms-key:
    file: ${ONPREM_DIR:-./.data/onprem}/minio-kms.key

volumes:
  cvg-storage:
  cvg-clamav:
