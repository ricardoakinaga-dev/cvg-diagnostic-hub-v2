# On-prem overlay (D11, PROD-307/PROD-308/PROD-514): object storage (MinIO) and the antivirus (ClamAV + the HTTPS
# scanner adapter) run on the hospital server, next to the production stack, instead of being managed services.
# Nothing here publishes a port: the app and the worker reach storage and scanner on the Compose network only.
#
#   bash scripts/onprem-init.sh .data/onprem          # once: internal CA, scanner certificate, MinIO KMS key (outside git)
#   bash scripts/secrets-init.sh .data/onprem/secrets  # once: the secret files of this environment (PROD-302)
#   docker compose -f docker-compose.prod.yml -f docker-compose.onprem.yml -f docker-compose.secrets.yml \
#     --env-file .env.production up -d --build
#
# .env.production for this overlay (values the base file requires):
#   STORAGE_ENDPOINT=http://storage:9000  STORAGE_FORCE_PATH_STYLE=true  STORAGE_BUCKET=cvg-attachments
#   STORAGE_ACCESS_KEY=cvg-app (user of app/worker, NOT the root)  OFFSITE_STORAGE_ACCESS_KEY=cvg-offsite
#   MALWARE_SCANNER_ENDPOINT=https://scanner:9443/scan  MALWARE_SCANNER_ALLOWED_HOSTS=scanner  SECRETS_DIR=<dir>
# Secrets of this overlay are ALWAYS files in SECRETS_DIR (D-051): storage_root_password (MinIO root, only storage and
# storage-iam), storage_secret_key (app/worker user), offsite_storage_secret_key (read-only user of the off-site copy),
# malware_scanner_api_key. Everything else (bucket hardening, encryption key, least privilege, quarantine owner, bucket
# copy and restore) is in docs/operations/DEPLOYMENT.md sections 12 and 13 and docs/operations/BACKUP_RESTORE.md.

x-onprem-storage-environment: &onprem-storage-environment
  STORAGE_MODE: s3
  STORAGE_ENDPOINT: http://storage:9000
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET must be set}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-cvg-app}
  STORAGE_SECRET_KEY: ""
  STORAGE_SECRET_KEY_FILE: /run/secrets/storage_secret_key
  STORAGE_FORCE_PATH_STYLE: "true"
  STORAGE_SCAN_MODE: external
  MALWARE_SCANNER_ENDPOINT: https://scanner:9443/scan
  MALWARE_SCANNER_ALLOWED_HOSTS: scanner
  MALWARE_SCANNER_API_KEY: ""
  MALWARE_SCANNER_API_KEY_FILE: /run/secrets/malware_scanner_api_key
  # The scanner certificate is signed by the internal CA generated by scripts/onprem-init.sh.
  NODE_EXTRA_CA_CERTS: /certs/ca.crt

x-onprem-ca-volume: &onprem-ca-volume ${ONPREM_DIR:-./.data/onprem}/certs/ca.crt:/certs/ca.crt:ro
x-onprem-app-secrets: &onprem-app-secrets ["storage_secret_key", "malware_scanner_api_key"]

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

services:
  # MinIO built from the pinned upstream source (deploy/minio/Dockerfile). Encryption at rest: every object is
  # encrypted with the key in the Docker secret (MINIO_KMS_SECRET_KEY_FILE, generated outside git by onprem-init.sh);
  # losing that file makes every attachment unreadable, so it belongs in the secret store with the database passwords.
  # No console, no published port. Versioning, default SSE, private policy and the lifecycle are applied and verified
  # by storage-init (scripts/init-storage.ts, STORAGE_HARDEN=true).
  storage:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-cvg-hub}-minio:${MINIO_IMAGE_TAG:-7aac2a2}
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    command: ["server", "/data"]
    restart: unless-stopped
    mem_limit: ${STORAGE_MEM_LIMIT:-1g}
    environment:
      # Root credentials (D-051): only this service and storage-iam see them; app, worker and offsite use their own users.
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:-cvg-root}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/storage_root_password
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio-kms-key
      MINIO_KMS_AUTO_ENCRYPTION: "on"
      MINIO_BROWSER: "off"
    secrets: ["minio-kms-key", "storage_root_password"]
    volumes:
      - cvg-storage:/data
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot on every `up`: creates the bucket when missing and applies + verifies the hardening (PROD-307, D-050).
  # Fails (and keeps app and worker down) when the bucket deviates: no versioning, no encryption, anonymous read
  # allowed, or a lifecycle that expires current objects.
  storage-init:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-cvg-hub}-ops:${IMAGE_TAG:-latest}
    command: ["node_modules/.bin/tsx", "scripts/init-storage.ts"]
    environment:
      <<: *onprem-storage-environment
      # Hardening needs bucket-level rights: the root user, from its file.
      STORAGE_ACCESS_KEY: ${STORAGE_ROOT_USER:-cvg-root}
      STORAGE_SECRET_KEY_FILE: /run/secrets/storage_root_password
      STORAGE_HARDEN: "true"
      STORAGE_NONCURRENT_VERSION_DAYS: ${STORAGE_NONCURRENT_VERSION_DAYS:-30}
    secrets: ["storage_root_password", "malware_scanner_api_key"]
    volumes:
      - *onprem-ca-volume
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"
    mem_limit: 512m

  # One-shot on every `up` (D-051, deploy/minio/iam.sh): least privilege. Creates/updates the app user (Get/Put/Delete
  # object, explicit Deny on versions, versioning, lifecycle, policy, encryption) and the read-only off-site user. The
  # root password never reaches app, worker or offsite. Rotation = change the file, `up -d`.
  storage-iam:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-cvg-hub}-mc:${MC_IMAGE_TAG:-7394ce0}
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile.mc
    environment:
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER:-cvg-root}
      STORAGE_ROOT_PASSWORD_FILE: /run/secrets/storage_root_password
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-cvg-app}
      STORAGE_SECRET_KEY_FILE: /run/secrets/storage_secret_key
      OFFSITE_STORAGE_ACCESS_KEY: ${OFFSITE_STORAGE_ACCESS_KEY:-cvg-offsite}
      OFFSITE_STORAGE_SECRET_KEY_FILE: /run/secrets/offsite_storage_secret_key
    secrets: ["storage_root_password", "storage_secret_key", "offsite_storage_secret_key"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      storage-init: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 128m

  # Real antivirus (PROD-308). The image ships the signature database and refreshes it with freshclam; the daemon
  # listens on 3310 for the scanner adapter only. Signature updates need egress to database.clamav.net (DEPLOYMENT section 11).
  clamav:
    logging: *default-logging
    image: clamav/clamav@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEM_LIMIT:-2g}
    volumes:
      - cvg-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

  # HTTPS adapter between the app's scan contract and clamd (deploy/local/scanner.mjs, shared with the local
  # installation). The app only accepts it over HTTPS with host `scanner` on the allowlist.
  scanner:
    logging: *default-logging
    image: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    # The uid/gid must be able to read scanner.key (mode 600): `scripts/onprem-init.sh <dir> --owner <uid>:<gid>`.
    user: "${SCANNER_UID:-1000}:${SCANNER_GID:-1000}"
    command: ["node", "/service/scanner.mjs"]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      MALWARE_SCANNER_API_KEY_FILE: /run/secrets/malware_scanner_api_key
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    secrets: ["malware_scanner_api_key"]
    volumes:
      - ./deploy/local/scanner.mjs:/service/scanner.mjs:ro
      - ${ONPREM_DIR:-./.data/onprem}/certs/scanner.crt:/certs/scanner.crt:ro
      - ${ONPREM_DIR:-./.data/onprem}/certs/scanner.key:/certs/scanner.key:ro
      - *onprem-ca-volume
    depends_on:
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:9443/health', {ca:require('fs').readFileSync('/certs/ca.crt')}, r => {r.resume(); if(r.statusCode!==200) process.exit(1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    environment: *onprem-storage-environment
    secrets: *onprem-app-secrets
    volumes:
      - *onprem-ca-volume
    depends_on:
      storage-iam: { condition: service_completed_successfully }
      scanner: { condition: service_healthy }

  # The worker removes attachment objects in the clinical purge (PROD-501) and validates the scanner configuration at boot.
  worker:
    environment: *onprem-storage-environment
    secrets: *onprem-app-secrets
    volumes:
      - *onprem-ca-volume
    depends_on:
      storage-iam: { condition: service_completed_successfully }

  migrate:
    environment: *onprem-storage-environment
    secrets: *onprem-app-secrets
    volumes:
      - *onprem-ca-volume

  bootstrap:
    environment: *onprem-storage-environment
    secrets: *onprem-app-secrets
    volumes:
      - *onprem-ca-volume

  # The off-site copy also ships the bucket (PROD-514): the `minio` rclone remote is defined from the environment
  # (no edit to rclone.conf) with the READ-ONLY user, and the objects go to <OFFSITE_RCLONE_REMOTE>/objects with
  # `copy --ignore-existing`.
  offsite:
    environment:
      OFFSITE_BUCKET_SOURCE: minio:${STORAGE_BUCKET:?}
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://storage:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${OFFSITE_STORAGE_ACCESS_KEY:-cvg-offsite}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY_FILE: /run/secrets/offsite_storage_secret_key
      RCLONE_CONFIG_MINIO_REGION: ${STORAGE_REGION:-us-east-1}
    secrets: ["offsite_storage_secret_key"]
    depends_on:
      storage-iam: { condition: service_completed_successfully }

  # Restore of the bucket from the off-site copy (BACKUP_RESTORE.md section 4.5), with the app user (PutObject allowed;
  # the offsite user cannot write). Not started by `up`:
  #   docker compose ... --profile restore run --rm storage-restore copy offsitecrypt:objects minio:<bucket> --ignore-existing
  storage-restore:
    image: rclone/rclone:1.71.2
    profiles: ["restore"]
    entrypoint: ["/bin/sh", "/opt/backup/rclone-with-secrets.sh"]
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://storage:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-cvg-app}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_secret_key
      RCLONE_CONFIG_MINIO_REGION: ${STORAGE_REGION:-us-east-1}
      OFFSITE_CRYPT_REMOTE: ${OFFSITE_CRYPT_REMOTE:-}
      OFFSITE_CRYPT_PASSWORD_FILE: /run/secrets/offsite_crypt_password
      OFFSITE_CRYPT_SALT_FILE: /run/secrets/offsite_crypt_salt
    secrets: ["storage_secret_key", "offsite_crypt_password", "offsite_crypt_salt"]
    volumes:
      - ./deploy/backup/rclone-with-secrets.sh:/opt/backup/rclone-with-secrets.sh:ro
      - ./deploy/backup/secrets-env.sh:/opt/backup/secrets-env.sh:ro
      - ${OFFSITE_RCLONE_CONFIG:-./deploy/backup/rclone.conf.example}:/config/rclone/rclone.conf:ro
    depends_on:
      storage-iam: { condition: service_completed_successfully }
    logging: *default-logging
    mem_limit: 256m

secrets:
  # "<key name>:<base64 of 32 random bytes>", written by scripts/onprem-init.sh with mode 600. Never in git.
  minio-kms-key:
    file: ${ONPREM_DIR:-./.data/onprem}/minio-kms.key
  # Written by scripts/secrets-init.sh (mode 600). SECRETS_DIR is shared with docker-compose.secrets.yml.
  storage_root_password:
    file: ${SECRETS_DIR:?SECRETS_DIR must point to the directory of secret files}/storage_root_password
  storage_secret_key:
    file: ${SECRETS_DIR:?}/storage_secret_key
  offsite_storage_secret_key:
    file: ${SECRETS_DIR:?}/offsite_storage_secret_key
  malware_scanner_api_key:
    file: ${SECRETS_DIR:?}/malware_scanner_api_key
  offsite_crypt_password:
    file: ${SECRETS_DIR:?}/offsite_crypt_password
  offsite_crypt_salt:
    file: ${SECRETS_DIR:?}/offsite_crypt_salt

volumes:
  cvg-storage:
  cvg-clamav:
