# Application host: TLS + client certificate exporter bound only to the host's private VPN address.
# The privileged collector runs under a local systemd timer. The exporter has no Docker socket and no backup mount.
services:
  validate:
    image: node:22-bookworm-slim
    user: "${MONITOR_UID:?Set MONITOR_UID}:${MONITOR_GID:?Set MONITOR_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MONITOR_ROLE: agent
      MONITOR_AGENT_BIND_IP: ${MONITOR_AGENT_BIND_IP:?Set the private VPN IPv4 address}
      MONITOR_CONFIG_DIR: /etc/cvg-monitor
      MONITOR_SECRETS_DIR: /run/secrets
    volumes:
      - ./scripts/monitoring-config.mjs:/validate/monitoring-config.mjs:ro
      - ${MONITOR_CONFIG_DIR:?}:/etc/cvg-monitor:ro
      - ${MONITOR_SECRETS_DIR:?}:/run/secrets:ro
    command: [node, /validate/monitoring-config.mjs, --check]
    network_mode: none

  node-exporter:
    image: prom/node-exporter:v1.12.1
    user: "${MONITOR_UID:?}:${MONITOR_GID:?}"
    restart: unless-stopped
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pid: host
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile", "--web.config.file=/etc/cvg-monitor/node-exporter-web.yml"]
    ports: ["${MONITOR_AGENT_BIND_IP:?}:9100:9100"]
    volumes:
      - /:/host:ro,rslave
      - ${CVG_MONITOR_TEXTFILE_DIR:?Create the collector output directory}:/textfile:ro
      - ${MONITOR_CONFIG_DIR:?}:/etc/cvg-monitor:ro
      - ${MONITOR_SECRETS_DIR:?}:/run/secrets:ro
    depends_on:
      validate: { condition: service_completed_successfully }
