# promtool test rules deploy/observability/alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - name: availability, delivery and capacity alerts fire on their signals
    interval: 30s
    input_series:
      - series: 'up{job="cvg-hub"}'
        values: "1x10 0x10"
      - series: 'cvg_readiness_failures{job="cvg-hub"}'
        values: "0x10 1x10"
      - series: 'http_requests_total{job="cvg-hub",method="GET",route="/api/v1/diagnostic-requests",status="200"}'
        values: "0+10x40"
      - series: 'http_requests_total{job="cvg-hub",method="GET",route="/api/v1/diagnostic-requests",status="500"}'
        values: "0+5x40"
      - series: 'http_request_duration_ms_sum{job="cvg-hub",method="GET",route="/api/v1/diagnostic-requests"}'
        values: "0+30000x40"
      - series: 'http_request_duration_ms_count{job="cvg-hub",method="GET",route="/api/v1/diagnostic-requests"}'
        values: "0+15x40"
      - series: 'cvg_outbox_oldest_age_seconds{job="cvg-hub"}'
        values: "0x5 400x20"
      - series: 'cvg_outbox_dead_letters{job="cvg-hub"}'
        values: "0x5 2x10"
      - series: 'cvg_realtime_connection_rejections_total{job="cvg-hub",reason="connection_limit"}'
        values: "0x5 3x10"
      - series: 'cvg_process_heap_used_bytes{job="cvg-hub"}'
        values: "100x5 900x40"
      - series: 'cvg_process_heap_limit_bytes{job="cvg-hub"}'
        values: "1000x45"
    alert_rule_test:
      - eval_time: 9m
        alertname: CvgHubScrapeDown
        exp_alerts:
          - exp_labels: { severity: critical, job: cvg-hub }
            exp_annotations:
              summary: "Prometheus não consegue ler as métricas do Hub há 2 minutos."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#banco-ou-readiness-indisponível"
      - eval_time: 6m
        alertname: CvgHubReadinessFailing
        exp_alerts:
          - exp_labels: { severity: critical, job: cvg-hub }
            exp_annotations:
              summary: "Verificações de readiness falharam nos últimos 10 minutos (banco, storage ou configuração)."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#banco-ou-readiness-indisponível"
      - eval_time: 18m
        alertname: CvgHubServerErrors
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Mais de 5% das requisições com erro 5xx por 10 minutos."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#triagem-comum"
      - eval_time: 19m
        alertname: CvgHubSlowRequests
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Latência média das requisições acima de 1 s por 15 minutos."
              runbook: "docs/operations/DEPLOYMENT.md#66-memória-e-volume-de-dados"
      - eval_time: 9m
        alertname: CvgOutboxStalled
        exp_alerts:
          - exp_labels: { severity: critical, job: cvg-hub }
            exp_annotations:
              summary: "Há notificação pendente há mais de 5 minutos: o worker do outbox pode estar parado (inclui resultado crítico)."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#outbox-atrasado-ou-dead-letter"
      - eval_time: 4m
        alertname: CvgOutboxDeadLetters
        exp_alerts:
          - exp_labels: { severity: critical, job: cvg-hub }
            exp_annotations:
              summary: "Notificações esgotaram as tentativas e aguardam reprocessamento ou descarte."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#outbox-atrasado-ou-dead-letter"
      - eval_time: 4m
        alertname: CvgRealtimeConnectionsRejected
        exp_alerts:
          - exp_labels: { severity: warning, job: cvg-hub, reason: connection_limit }
            exp_annotations:
              summary: "Conexões de tempo real recusadas por limite de capacidade nos últimos 10 minutos."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#realtime-degradado"
      - eval_time: 19m
        alertname: CvgHeapNearLimit
        exp_alerts:
          - exp_labels: { severity: warning, job: cvg-hub }
            exp_annotations:
              summary: "O heap do app passa de 85% do limite: o volume de dados pede mais memória (APP_HEAP_MB/APP_MEM_LIMIT)."
              runbook: "docs/operations/DEPLOYMENT.md#66-memória-e-volume-de-dados"
      - eval_time: 1m
        alertname: CvgHeapNearLimit
        exp_alerts: []

  - name: a restarted process is reported, a long-running one is not
    interval: 30s
    input_series:
      - series: 'up{job="cvg-hub"}'
        values: "1x20"
      - series: 'cvg_process_uptime_seconds{job="cvg-hub"}'
        values: "30+30x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: CvgProcessRestarted
        exp_alerts:
          - exp_labels: { severity: info, job: cvg-hub }
            exp_annotations:
              summary: "O processo do app reiniciou nos últimos 5 minutos (deploy, OOM ou falha)."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#triagem-comum"
      - eval_time: 9m
        alertname: CvgProcessRestarted
        exp_alerts: []

  - name: a distributed login attempt signal is reported once and then clears
    interval: 30s
    input_series:
      - series: 'cvg_login_distributed_attempt_signals_total{job="cvg-hub"}'
        values: "0x10 1x80"
    alert_rule_test:
      - eval_time: 5m
        alertname: CvgLoginDistributedAttempts
        exp_alerts: []
      - eval_time: 6m
        alertname: CvgLoginDistributedAttempts
        exp_alerts:
          - exp_labels: { severity: warning, job: cvg-hub }
            exp_annotations:
              summary: "Uma conta recebeu muitas senhas erradas somadas de vários clientes (sinal agregado, sem bloqueio)."
              runbook: "docs/operations/INCIDENT_RUNBOOKS.md#tentativas-de-login-distribuídas"
      - eval_time: 30m
        alertname: CvgLoginDistributedAttempts
        exp_alerts: []
