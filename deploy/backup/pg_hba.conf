# Used with -c hba_file (docker-compose.prod.yml). Same rules as the image default plus one line that lets the
# dedicated backup role open a replication connection for pg_basebackup. The compose network is private
# (no published port), and every rule requires a password except the container-local socket.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    replication     cvg_backup      all                     scram-sha-256
host    all             all             all                     scram-sha-256
