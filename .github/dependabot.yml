version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Matched first: the coverage provider must share vitest's exact version.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # react-dom requires the same react version (#18 bumped react-dom alone).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # main requires an up-to-date branch, so every separate PR costs a full
      # CI cycle; compatible updates arrive together once a week.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Runtime is Node 22 (engines, .nvmrc, Dockerfile, CI). Newer types would
      # accept APIs that production does not have.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Must move with the CI browser image digest and the visual baselines
      # (scripts/update-visual-baselines.sh); bump the three together by hand.
      - dependency-name: "@playwright/test"
      # The vendored fast-glob is verified against the source hashes of the Next
      # ESLint plugin 16.3.0 (scripts/eslint-glob.test.mjs). A bump needs the
      # oracle re-captured first.
      - dependency-name: "eslint-config-next"
      # Majors that need a planned migration; evidence from 2026-10-07.
      # typescript 7 is outside typescript-eslint's peer range (<6.1.0).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest 5 removed describe.sequential; four test files stop loading.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # jsdom 30 changes the accessible names four UI tests rely on.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 requires vite 8; vitest 4 runs on vite 7.
      # Upgrade together with vitest 5.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # eslint 10 aborts with "scopeManager.addGlobals is not a function" in
      # the current plugin stack, and 45 eslint-glob parity tests fail.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
