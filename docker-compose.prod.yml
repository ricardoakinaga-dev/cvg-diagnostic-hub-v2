# Production stack: TLS edge -> web app, outbox worker and PostgreSQL.
# Object storage (S3-compatible) and the malware scanner come from docker-compose.onprem.yml on the hospital server
# (D11) or from managed services configured through the env file; see docs/operations/DEPLOYMENT.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm bootstrap   # first deploy only
#
# Secrets (PROD-302): every secret below accepts a NAME_FILE variant (Docker secret mounted read-only), filled by
# docker-compose.secrets.yml; the processes read NAME_FILE at start (src/server/security/file-secrets.ts) and refuse
# NAME and NAME_FILE set together. The connection strings carry $${NAME} placeholders expanded at process start, so no
# password is interpolated by Compose into a URL. With an env file only (no secrets overlay) the NAME values are used.

x-app-environment: &app-environment
  NODE_ENV: production
  APP_DATA_MODE: postgres
  # The application and the worker connect as the runtime role: DML only, no DDL, append-only audit_events.
  # The DDL credentials are NOT part of this shared block; only the one-shot migrate service receives them.
  DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-cvg_runtime}:$${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:?}
  POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
  POSTGRES_RUNTIME_PASSWORD_FILE: ${POSTGRES_RUNTIME_PASSWORD_FILE:-}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  SESSION_SECRET: ${SESSION_SECRET:-}
  SESSION_SECRET_FILE: ${SESSION_SECRET_FILE:-}
  APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN must be set}
  TRUST_PROXY: "true"
  TRUST_PROXY_SHARED_SECRET: ${TRUST_PROXY_SHARED_SECRET:-}
  TRUST_PROXY_SHARED_SECRET_FILE: ${TRUST_PROXY_SHARED_SECRET_FILE:-}
  RATE_LIMIT_MODE: postgres
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
  LOGIN_CLIENT_RATE_LIMIT: ${LOGIN_CLIENT_RATE_LIMIT:-60}
  ATTACHMENT_UPLOAD_RATE_LIMIT: ${ATTACHMENT_UPLOAD_RATE_LIMIT:-30}
  ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
  REALTIME_NOTIFICATION_ADAPTER: postgres-listen
  REALTIME_NOTIFICATION_CHANNEL: ${REALTIME_NOTIFICATION_CHANNEL:-cvg_realtime_wakeup}
  REALTIME_LISTEN_POOL_MAX: ${REALTIME_LISTEN_POOL_MAX:-2}
  STORAGE_MODE: s3
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT must be set}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET must be set}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
  STORAGE_SECRET_KEY_FILE: ${STORAGE_SECRET_KEY_FILE:-}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
  STORAGE_SCAN_MODE: external
  MALWARE_SCANNER_ENDPOINT: ${MALWARE_SCANNER_ENDPOINT:?MALWARE_SCANNER_ENDPOINT must be set}
  MALWARE_SCANNER_API_KEY: ${MALWARE_SCANNER_API_KEY:-}
  MALWARE_SCANNER_API_KEY_FILE: ${MALWARE_SCANNER_API_KEY_FILE:-}
  MALWARE_SCANNER_ALLOWED_HOSTS: ${MALWARE_SCANNER_ALLOWED_HOSTS:?MALWARE_SCANNER_ALLOWED_HOSTS must be set}
  MALWARE_SCANNER_TIMEOUT_MS: ${MALWARE_SCANNER_TIMEOUT_MS:-10000}
  CRITICAL_POLICY_ENABLED: ${CRITICAL_POLICY_ENABLED:-false}
  CRITICAL_POLICY_VERSION: ${CRITICAL_POLICY_VERSION:-}
  CRITICAL_POLICY_APPROVAL_REF: ${CRITICAL_POLICY_APPROVAL_REF:-}
  CRITICAL_POLICY_APPROVED_AT: ${CRITICAL_POLICY_APPROVED_AT:-}
  # PROD-402: escalation ladder run by the worker (defaults repeat the code: 15/30/60 min, requester first).
  CRITICAL_POLICY_EFFECTIVE_FROM: ${CRITICAL_POLICY_EFFECTIVE_FROM:-}
  CRITICAL_POLICY_ESCALATION_AFTER_MS: ${CRITICAL_POLICY_ESCALATION_AFTER_MS:-900000,1800000,3600000}
  CRITICAL_POLICY_RECIPIENT_RULES: ${CRITICAL_POLICY_RECIPIENT_RULES:-REQUESTER,RESPONSIBLE,DEPARTMENT_MANAGER,ON_CALL,ADMIN_FALLBACK}
  CRITICAL_POLICY_DISTINCT_RECIPIENTS: ${CRITICAL_POLICY_DISTINCT_RECIPIENTS:-true}
  # D-056: without WhatsApp, the hospital's written acceptance of "Hub only" for critical results (readiness check).
  CRITICAL_POLICY_IN_APP_ONLY_APPROVAL_REF: ${CRITICAL_POLICY_IN_APP_ONLY_APPROVAL_REF:-}
  # PROD-402 (D3): WhatsApp Business channel of critical results. The app queues and receives the
  # delivery webhook, the worker sends; both read the same block. Off until the template is approved.
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  WHATSAPP_API_BASE: ${WHATSAPP_API_BASE:-https://graph.facebook.com}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v26.0}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_ACCESS_TOKEN_FILE: ${WHATSAPP_ACCESS_TOKEN_FILE:-}
  WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
  WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
  WHATSAPP_TIMEOUT_MS: ${WHATSAPP_TIMEOUT_MS:-10000}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_APP_SECRET_FILE: ${WHATSAPP_APP_SECRET_FILE:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_VERIFY_TOKEN_FILE: ${WHATSAPP_VERIFY_TOKEN_FILE:-}
  WHATSAPP_WEBHOOK_RATE_LIMIT: ${WHATSAPP_WEBHOOK_RATE_LIMIT:-600}
  WHATSAPP_WEBHOOK_MAX_BYTES: ${WHATSAPP_WEBHOOK_MAX_BYTES:-262144}
  # Tunables documented in .env.production.example. --env-file only feeds
  # interpolation, so a value not listed here never reaches the containers.
  # The defaults repeat the code defaults.
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-1800000}
  SESSION_ACTIVITY_TOUCH_INTERVAL_MS: ${SESSION_ACTIVITY_TOUCH_INTERVAL_MS:-60000}
  SESSION_RETENTION_MS: ${SESSION_RETENTION_MS:-86400000}
  IDEMPOTENCY_RETENTION_MS: ${IDEMPOTENCY_RETENTION_MS:-86400000}
  OUTBOX_STATE_RETENTION_MS: ${OUTBOX_STATE_RETENTION_MS:-86400000}
  STATE_OUTBOX_HOT_WINDOW: ${STATE_OUTBOX_HOT_WINDOW:-100}
  REALTIME_SHARED_READ_MIN_INTERVAL_MS: ${REALTIME_SHARED_READ_MIN_INTERVAL_MS:-1000}
  REALTIME_SHARED_NOTIFY_DEBOUNCE_MS: ${REALTIME_SHARED_NOTIFY_DEBOUNCE_MS:-0}
  AUTHENTICATED_RATE_LIMIT: ${AUTHENTICATED_RATE_LIMIT:-240}
  UNAUTHENTICATED_RATE_LIMIT: ${UNAUTHENTICATED_RATE_LIMIT:-120}
  HEALTH_RATE_LIMIT: ${HEALTH_RATE_LIMIT:-60}
  PASSWORD_RESET_TTL_MS: ${PASSWORD_RESET_TTL_MS:-3600000}
  PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-off}
  PASSWORD_BREACH_CHECK_FAIL: ${PASSWORD_BREACH_CHECK_FAIL:-open}
  PASSWORD_BREACH_CHECK_TIMEOUT_MS: ${PASSWORD_BREACH_CHECK_TIMEOUT_MS:-3000}
  LOGIN_ACCOUNT_SIGNAL_WINDOW_MS: ${LOGIN_ACCOUNT_SIGNAL_WINDOW_MS:-900000}
  LOGIN_ACCOUNT_SIGNAL_THRESHOLD: ${LOGIN_ACCOUNT_SIGNAL_THRESHOLD:-20}
  JSON_BODY_MAX_BYTES: ${JSON_BODY_MAX_BYTES:-1048576}
  JSON_BODY_MAX_DEPTH: ${JSON_BODY_MAX_DEPTH:-32}
  DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
  # Optional Prometheus bearer for GET /api/v1/metrics (32+ characters; empty disables it).
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  METRICS_SCRAPE_TOKEN_FILE: ${METRICS_SCRAPE_TOKEN_FILE:-}
  METRICS_SCRAPE_RATE_LIMIT: ${METRICS_SCRAPE_RATE_LIMIT:-60}
  # Sample accession labels (PROD-405).
  ACCESSION_PREFIX: ${ACCESSION_PREFIX:-A}
  LABEL_WIDTH_MM: ${LABEL_WIDTH_MM:-50}
  LABEL_HEIGHT_MM: ${LABEL_HEIGHT_MM:-30}

# Container logs rotate by default only if asked: without this a busy host fills its disk with json-file logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

services:
  postgres:
    logging: *default-logging
    init: true
    image: postgres:16-alpine
    restart: unless-stopped
    # Continuous WAL archiving (PROD-304, D2): a segment is closed at least every WAL_ARCHIVE_TIMEOUT_SECONDS and
    # copied atomically into cvg-wal-archive by archive-wal.sh; the offsite service ships it out of the building.
    # A failing archive_command makes PostgreSQL retry and keep the WAL, so a full archive volume is an alert, not data loss.
    entrypoint: ["/bin/sh", "/opt/backup/postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=${WAL_ARCHIVE_TIMEOUT_SECONDS:-300}
      - -c
      - archive_command=/bin/sh /opt/backup/archive-wal.sh %p %f
      - -c
      - hba_file=/opt/backup/pg_hba.conf
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      # The official image reads POSTGRES_PASSWORD_FILE itself (first initialization of the volume only).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - cvg-postgres:/var/lib/postgresql/data
      - cvg-wal-archive:/wal-archive
      - ./deploy/backup/postgres-entrypoint.sh:/opt/backup/postgres-entrypoint.sh:ro
      - ./deploy/backup/archive-wal.sh:/opt/backup/archive-wal.sh:ro
      - ./deploy/backup/pg_hba.conf:/opt/backup/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot, runs before app and worker on every `up`. It is the only service that holds the
  # administrative and DDL credentials: it creates/rotates the migration and runtime roles, hands the
  # schema to the migration role, applies migrations and grants the runtime role DML only.
  migrate:
    build: { context: ., target: ops }
    image: ${IMAGE_PREFIX:-cvg-hub}-ops:${IMAGE_TAG:-latest}
    command: ["node_modules/.bin/tsx", "scripts/db-roles.ts"]
    environment:
      <<: *app-environment
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:?}:$${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      # Creates the cvg_backup role (REPLICATION) used by pg_basebackup in the backup service; unset = no role.
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:-}
      POSTGRES_BACKUP_PASSWORD_FILE: ${POSTGRES_BACKUP_PASSWORD_FILE:-}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_MIGRATION_USER:-cvg_migrator}:$${POSTGRES_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB:?}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-}
      POSTGRES_MIGRATION_PASSWORD_FILE: ${POSTGRES_MIGRATION_PASSWORD_FILE:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-shot: creates the first ADMIN on an empty database. Refuses to run
  # against an initialized database. Not started by `up`. Also runs the
  # emergency reset-link command. Both print a single-use reset link, so the
  # service has no log driver: the line reaches only the terminal of
  # `docker compose run`, never a json-file on the host or a log collector.
  bootstrap:
    logging:
      driver: none
    image: ${IMAGE_PREFIX:-cvg-hub}-ops:${IMAGE_TAG:-latest}
    profiles: ["bootstrap"]
    command: ["node_modules/.bin/tsx", "scripts/bootstrap-admin.ts"]
    environment:
      <<: *app-environment
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administração}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  app:
    logging: *default-logging
    init: true
    # Each process keeps the whole runtime aggregate in memory (D-030). Measured
    # on 2026-10-08: peak RSS 539 MB at 12 months (55k exams, 700 MB heap) and
    # 912 MB at 24 months (110k, 1200 MB heap). Size both values from D2.
    mem_limit: ${APP_MEM_LIMIT:-2g}
    build: { context: ., target: runner }
    image: ${IMAGE_PREFIX:-cvg-hub}:${IMAGE_TAG:-latest}
    environment:
      <<: *app-environment
      NODE_OPTIONS: --max-old-space-size=${APP_HEAP_MB:-1280}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # No published port: only the edge proxy reaches the app.
    expose: ["3000"]

  worker:
    logging: *default-logging
    init: true
    # The worker holds the same aggregate: 413 MB at 12 months, 700 MB at 24.
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    image: ${IMAGE_PREFIX:-cvg-hub}-ops:${IMAGE_TAG:-latest}
    command: ["node_modules/.bin/tsx", "scripts/outbox-worker.ts"]
    environment:
      <<: *app-environment
      NODE_OPTIONS: --max-old-space-size=${WORKER_HEAP_MB:-768}
      OUTBOX_SINK: postgres
      OUTBOX_DELIVERY_CHANNEL: ${OUTBOX_DELIVERY_CHANNEL:-IN_APP}
      OUTBOX_HEARTBEAT_FILE: ${OUTBOX_HEARTBEAT_FILE:-/tmp/outbox-worker-heartbeat.json}
      OUTBOX_HEARTBEAT_MAX_AGE_MS: ${OUTBOX_HEARTBEAT_MAX_AGE_MS:-30000}
      OUTBOX_HEARTBEAT_ERROR_TOLERANCE: ${OUTBOX_HEARTBEAT_ERROR_TOLERANCE:-3}
      RUNTIME_RETENTION_INTERVAL_MS: ${RUNTIME_RETENTION_INTERVAL_MS:-3600000}
      RATE_LIMIT_BUCKET_RETENTION_MS: ${RATE_LIMIT_BUCKET_RETENTION_MS:-7200000}
      ARCHIVE_ACTIVE_MONTHS: ${ARCHIVE_ACTIVE_MONTHS:-24}
      ARCHIVE_INTERVAL_MS: ${ARCHIVE_INTERVAL_MS:-86400000}
      ARCHIVE_PURGE_AFTER_MONTHS: ${ARCHIVE_PURGE_AFTER_MONTHS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Plain node, not tsx: a probe that transpiles on every 10s interval costs
    # more than the check. Docker Compose does not restart an unhealthy
    # container by itself, so the signal is for external monitoring or an
    # orchestrator; see docs/operations/DEPLOYMENT.md.
    healthcheck:
      test: ["CMD", "node", "scripts/outbox-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  proxy:
    logging: *default-logging
    mem_limit: ${PROXY_MEM_LIMIT:-256m}
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      TRUST_PROXY_SHARED_SECRET: ${TRUST_PROXY_SHARED_SECRET:-}
      TRUST_PROXY_SHARED_SECRET_FILE: ${TRUST_PROXY_SHARED_SECRET_FILE:-}
    # Caddy reads the shared secret from the environment; with a Docker secret the wrapper exports it from the file.
    command: ["/bin/sh", "-c", "if [ -n \"$$TRUST_PROXY_SHARED_SECRET_FILE\" ]; then TRUST_PROXY_SHARED_SECRET=\"$$(cat \"$$TRUST_PROXY_SHARED_SECRET_FILE\")\"; export TRUST_PROXY_SHARED_SECRET; fi; [ -n \"$$TRUST_PROXY_SHARED_SECRET\" ] || { echo 'TRUST_PROXY_SHARED_SECRET or TRUST_PROXY_SHARED_SECRET_FILE must be set' >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - cvg-caddy-data:/data
      - cvg-caddy-config:/config
    depends_on:
      app: { condition: service_healthy }

  # Daily logical dump + daily physical base backup into the cvg-backups volume, and pruning of both and of the WAL
  # archive (see deploy/backup/backup-loop.sh). The dump runs as the runtime role; the base backup runs as cvg_backup,
  # the only role with REPLICATION (created by the migrate service from POSTGRES_BACKUP_PASSWORD).
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/opt/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?}
      PGUSER: ${POSTGRES_RUNTIME_USER:-cvg_runtime}
      PGPASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
      PGPASSWORD_FILE: ${POSTGRES_RUNTIME_PASSWORD_FILE:-}
      PGBACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:-}
      PGBACKUP_PASSWORD_FILE: ${POSTGRES_BACKUP_PASSWORD_FILE:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup/backup-loop.sh:/opt/backup-loop.sh:ro
      - ./deploy/backup/secrets-env.sh:/opt/backup/secrets-env.sh:ro
      - cvg-backups:/backups
      - cvg-wal-archive:/wal-archive
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m

  # Off-site copy (PROD-304): ships the WAL archive and the backups to OFFSITE_RCLONE_REMOTE every
  # OFFSITE_SHIP_INTERVAL_SECONDS. Opt-in: with the remote empty it logs offsite.disabled and idles; the stack runs without it.
  # Healthy = last successful shipment younger than 3 x interval (deploy/backup/check-offsite.sh). The rclone
  # config (credentials) is mounted read-only from OFFSITE_RCLONE_CONFIG and never committed.
  # Nothing is ever deleted or overwritten on the remote (WAL, dumps and base backups all use `rclone copy --ignore-existing`); a cycle is refused
  # (offsite.refused, status error) when /backups has no valid backup younger than OFFSITE_MAX_BACKUP_AGE_SECONDS
  # (empty = 2 x BACKUP_INTERVAL_SECONDS). Remote retention is a lifecycle rule of the destination.
  offsite:
    image: rclone/rclone:1.71.2
    entrypoint: ["/bin/sh", "/opt/backup/ship-offsite.sh"]
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
      OFFSITE_RCLONE_REMOTE: ${OFFSITE_RCLONE_REMOTE:-}
      OFFSITE_SHIP_INTERVAL_SECONDS: ${OFFSITE_SHIP_INTERVAL_SECONDS:-300}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      OFFSITE_MAX_BACKUP_AGE_SECONDS: ${OFFSITE_MAX_BACKUP_AGE_SECONDS:-}
      # Encrypted destination (D-051): the `offsitecrypt` remote wraps OFFSITE_CRYPT_REMOTE with the passphrase and salt
      # read from files; OFFSITE_RCLONE_REMOTE=offsitecrypt: then. Plaintext destinations need OFFSITE_ALLOW_PLAINTEXT=true.
      OFFSITE_CRYPT_REMOTE: ${OFFSITE_CRYPT_REMOTE:-}
      OFFSITE_CRYPT_PASSWORD: ${OFFSITE_CRYPT_PASSWORD:-}
      OFFSITE_CRYPT_PASSWORD_FILE: ${OFFSITE_CRYPT_PASSWORD_FILE:-}
      OFFSITE_CRYPT_SALT: ${OFFSITE_CRYPT_SALT:-}
      OFFSITE_CRYPT_SALT_FILE: ${OFFSITE_CRYPT_SALT_FILE:-}
      OFFSITE_ALLOW_PLAINTEXT: ${OFFSITE_ALLOW_PLAINTEXT:-false}
    volumes:
      - ./deploy/backup/ship-offsite.sh:/opt/backup/ship-offsite.sh:ro
      - ./deploy/backup/secrets-env.sh:/opt/backup/secrets-env.sh:ro
      # Manual rclone runs inside this container (runbooks) go through the helper, which loads the *_FILE secrets
      # and defines the crypt remote: docker compose ... exec offsite sh /opt/backup/rclone-with-secrets.sh lsd offsitecrypt:
      - ./deploy/backup/rclone-with-secrets.sh:/opt/backup/rclone-with-secrets.sh:ro
      - ./deploy/backup/check-offsite.sh:/opt/backup/check-offsite.sh:ro
      - ${OFFSITE_RCLONE_CONFIG:-./deploy/backup/rclone.conf.example}:/config/rclone/rclone.conf:ro
      - cvg-wal-archive:/wal-archive:ro
      - cvg-backups:/backups
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/backup/check-offsite.sh"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m

volumes:
  cvg-postgres:
  cvg-backups:
  cvg-wal-archive:
  cvg-caddy-data:
  cvg-caddy-config:
